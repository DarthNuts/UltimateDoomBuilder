ztopenprojectmap
{
	title = "ZT: Open Project Map";
	category = "tools";
	description = "Opens a map of the Zero Tolerance project straight from wad-src/ of the git working copy; saving writes the map lumps back to those files.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}

ztsend
{
	title = "ZT: Send Fresh Changes";
	category = "tools";
	description = "Saves the project map, commits all changes of the working copy and pushes the current branch.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}

ztget
{
	title = "ZT: Get Fresh Changes";
	category = "tools";
	description = "Saves the project map, commits local changes, merges the current branch from the server and reloads the map if it changed.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}
