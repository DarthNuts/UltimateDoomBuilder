ztopenprojectmap
{
	title = "ZT: Open Project Map";
	category = "tools";
	description = "Opens a map of the Zero Tolerance project straight from wad-src/ of the git working copy; saving writes the map lumps back to those files.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}

ztsend
{
	title = "ZT: Send Fresh Changes";
	category = "tools";
	description = "Saves the project map, commits all changes of the working copy and pushes the current branch.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}

ztget
{
	title = "ZT: Get Fresh Changes";
	category = "tools";
	description = "Saves the project map, commits local changes, merges the current branch from the server and reloads the map in place (one undo step) if it changed.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}

ztgetbuild
{
	title = "ZT: Get Build";
	category = "tools";
	description = "The AI machine builds the WAD and pk3 of the current branch from the server; changed files are downloaded to the GZDoom folder and UDB reloads its resources.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}

ztopenfile
{
	title = "ZT: Open Project File";
	category = "tools";
	description = "Opens a file of the project working copy (ZScript, DECORATE, MAPINFO...) in the script editor; trailing whitespace is kept on save.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}

ztcheckscripts
{
	title = "ZT: Check Mod Scripts (GZDoom)";
	category = "tools";
	description = "Loads the mod in GZDoom (-norun) with the project src/ folder instead of the built pk3 and shows ZScript/DECORATE errors in the script editor.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}

zttestmap
{
	title = "ZT: Test Map (Mod Load Order)";
	category = "tools";
	description = "Tests the map in GZDoom with the mod load order of ZeroTolerance.bat and the project src/ folder instead of the built pk3.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}

ztreloadmap
{
	title = "ZT: Reload Map From Files";
	category = "tools";
	description = "Reloads the open project map from wad-src/ in place as one undo step, keeping the view, mode and selection.";
	allowkeys = true;
	allowmouse = false;
	allowscroll = false;
}
